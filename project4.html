<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Four - Steven Gyenes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-xl font-bold text-gray-900 hover:text-indigo-600 transition">
                        Steven Gyenes
                    </a>
                </div>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html#about" class="text-gray-600 hover:text-indigo-600 font-medium transition">About</a>
                    <a href="index.html#projects" class="text-gray-600 hover:text-indigo-600 font-medium transition">Projects</a>
                    <a href="index.html#contact" class="text-gray-600 hover:text-indigo-600 font-medium transition">Contact</a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-600 hover:text-gray-900 focus:outline-none p-2 rounded-md">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-2">
            <a href="index.html#about" class="block text-gray-600 hover:text-indigo-600 font-medium py-2">About</a>
            <a href="index.html#projects" class="block text-gray-600 hover:text-indigo-600 font-medium py-2">Projects</a>
            <a href="index.html#contact" class="block text-gray-600 hover:text-indigo-600 font-medium py-2">Contact</a>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="flex-grow py-12 md:py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Back Button Link -->
            <div class="mb-6">
                <a href="index.html#projects" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-medium transition">
                    &larr; Back to Projects
                </a>
            </div>

            <!-- Project Title Header -->
            <div class="mb-8">
                <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-2">
                    Project Four Title
                </h1>
                <p class="text-lg text-gray-600">
                    A brief subtitle or category description for Project Four.
                </p>
            </div>

            <!-- Project Featured Image -->
            <div class="w-full bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-10">
                <img 
                    src="" 
                    alt="Project Four Main Image" 
                    class="w-full h-auto object-cover max-h-[450px]"
                />
            </div>

            <!-- Project Body Content -->
            <article class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sm:p-8 space-y-6 text-gray-700 leading-relaxed">
                <h2 class="text-2xl font-bold text-gray-900">Project Overview</h2>
                <p>
                    Project body text sample.
                </p>
                <p>
                    Add as many paragraphs, images, technical details, or code.
                </p>
                
                <!-- External Demo / Source Code Link -->
                <!-- <div class="pt-6 border-t border-gray-200 mt-8">
                    <a href="#" target="_blank" rel="noopener noreferrer" class="inline-block bg-indigo-600 text-white font-semibold px-6 py-3 rounded-lg shadow hover:bg-indigo-700 transition">
                        View Live Demo / Source Code &rarr;
                    </a>
                </div>
            </article>

        </div>
    -->
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => menu.classList.toggle('hidden'));
        menu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => menu.classList.add('hidden')));
    </script>
</body>
</html>
